packages:
  - apps/*
  - packages/*
  - contracts/*

# Security patch replacements for exact transitive pins in upstream tooling.
# Keep major/minor compatibility; remove each override when its parent is fixed.
overrides:
  'handlebars@4.7.8': 4.7.10
  'brace-expansion@5.0.8': 5.0.12
  'nanoid@3.3.16': 3.3.18

allowBuilds:
  esbuild: true
  sharp: false
  workerd: false
