[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "Synthetic negative-test marker; not a usable credential"
condition = "AND"
paths = ["(?:^|/)\\Qscripts/tests/test_release_v2_unsafe_markers.py\\E$"]
regexTarget = "match"
regexes = ["^\\QeyJhbGciOiJub25lIn0.eyJzdWIiOiJydW5uZS10ZXN0LW9ubHkifQ.not-a-signature\"\\E$"]

[[rules]]
id = "private-key"
[[rules.allowlists]]
description = "Explicit fake canary; not a cryptographic private key"
condition = "AND"
paths = ["(?:^|/)\\Qcrates/runne-daemon/tests/support/nm10_rules.rs\\E$"]
regexTarget = "match"
regexes = ["^\\Q-----BEGIN RUNNE T1 FAKE PRIVATE KEY-----\\nRUNNE_T1_FAKE_PEM_BODY_5e6f7a8b\\n-----END RUNNE T1 FAKE PRIVATE KEY-----\\E$"]
[[rules.allowlists]]
description = "Explicit fake canary; not a cryptographic private key"
condition = "AND"
paths = ["(?:^|/)\\Qdocs/golden/t1/fake-canary-secrets-v1.json\\E$"]
regexTarget = "match"
regexes = ["^\\Q-----BEGIN RUNNE T1 FAKE PRIVATE KEY-----\\nRUNNE_T1_FAKE_PEM_BODY_5e6f7a8b\\n-----END RUNNE T1 FAKE PRIVATE KEY-----\\E$"]

