title = "Runne reviewed synthetic test fixtures"
[extend]
useDefault = true

# Exceptions require BOTH an exact file path and exact reviewed match.
# No directory-wide or credential-format-wide exclusions.

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Reviewed non-secret idempotency label, metadata row name, or public SHA-256 pin"
condition = "AND"
paths = ["(?:^|/)\\Qcrates/runne-cli/src/cli/permissions/approval_response_tests/fakes.rs\\E$"]
regexTarget = "match"
regexes = ["^\\Qidempotency_key: \"approval-key-01\"\\E$"]
[[rules.allowlists]]
description = "Reviewed non-secret idempotency label, metadata row name, or public SHA-256 pin"
condition = "AND"
paths = ["(?:^|/)\\Qcrates/runne-cli/src/cli/permissions/tests/command_tests.rs\\E$"]
regexTarget = "match"
regexes = ["^\\Q--idempotency-key\", \"approval-key-01\"\\E$"]
[[rules.allowlists]]
description = "Reviewed non-secret idempotency label, metadata row name, or public SHA-256 pin"
condition = "AND"
paths = ["(?:^|/)\\Qcrates/runne-cli/src/cli/permissions/tests/command_tests.rs\\E$"]
regexTarget = "match"
regexes = ["^\\Qintent.idempotency_key == \"approval-key-01\"\\E$"]
[[rules.allowlists]]
description = "Reviewed non-secret idempotency label, metadata row name, or public SHA-256 pin"
condition = "AND"
paths = ["(?:^|/)\\Qcrates/runne-cli/src/cli/permissions/approval_recovery_tests.rs\\E$"]
regexTarget = "match"
regexes = ["^\\Qidempotency_key: \"approval-key-01\"\\E$"]
