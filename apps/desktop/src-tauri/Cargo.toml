[package]
name = "runne-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
test-support = ["runne-app-core/test-support"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
runne-app-core = { path = "../../../crates/runne-app-core" }
runne-api = { path = "../../../crates/runne-api" }
runne-platform-desktop = { path = "../../../crates/runne-platform-desktop", features = ["protected-channel-integration"] }
hex.workspace = true
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-single-instance = "=2.4.3"
tokio.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
