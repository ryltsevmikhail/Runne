[package]
name = "runne-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"
# Explicit target discovery only: `tauri build` enumerates every `[[bin]]`
# target of this package and copies each into the bundle, so the feature-gated
# D2 GUI qualification harness must stay a non-bin target (`[[example]]`).
autobins = false
autoexamples = false

[[bin]]
name = "runne-desktop"
path = "src/main.rs"

[[example]]
name = "d2-gui-qualification"
path = "examples/d2_gui_qualification.rs"
required-features = ["test-support"]

[features]
custom-protocol = ["tauri/custom-protocol"]
dev-loopback-updater = ["runne-platform-desktop/dev-loopback-updater"]
test-support = ["runne-app-core/test-support"]
linux-native-enrollment-qualification = [
    "runne-app-core/linux-native-enrollment-qualification",
    "runne-platform-desktop/linux-native-enrollment-qualification",
]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
runne-app-core = { path = "../../../crates/runne-app-core" }
runne-api = { path = "../../../crates/runne-api" }
runne-platform-desktop = { path = "../../../crates/runne-platform-desktop", features = ["protected-channel-integration"] }
runne-macos-xpc = { path = "../../../crates/runne-macos-xpc" }
hex.workspace = true
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri.workspace = true
# Linux: the xdg-portal backend avoids rfd's in-process GTK thread, whose
# second gtk_init deadlocks the Tauri Wayland event loop before any dialog
# maps. No effect on macOS/Windows native dialog implementations.
tauri-plugin-dialog = { version = "=2.7.2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-single-instance = "=2.4.5"
notify-rust = { version = "=4.18.0", features = ["preview-macos-un"] }
tokio.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
nix = { version = "=0.31.3", default-features = false, features = ["fs", "poll", "socket"] }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSSecureTextField", "NSTextField", "NSView", "NSWindow", "block2"] }
objc2-foundation = { version = "=0.3.2", features = ["NSRange", "NSString"] }
runne-native-qualification = { path = "../../../crates/runne-native-qualification" }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["test-util"] }
runne-platform-desktop = { path = "../../../crates/runne-platform-desktop", features = ["protected-channel-integration", "test-support"] }
toml = "0.8"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
