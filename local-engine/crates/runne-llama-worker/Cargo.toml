[package]
name = "runne-llama-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
runne-inference-protocol = { path = "../runne-inference-protocol" }
serde_json = "1"
sha2.workspace = true
rustix = { workspace = true, features = ["fs", "std"] }
encoding_rs.workspace = true
llama-cpp-2 = { workspace = true, optional = true }
llama-cpp-sys-2 = { workspace = true, optional = true }

[features]
backend-llama-cpp = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]

[[bin]]
name = "runne-llama-worker"
path = "src/main.rs"
required-features = ["backend-llama-cpp"]

[[test]]
name = "llama_cpu"
required-features = ["backend-llama-cpp"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
