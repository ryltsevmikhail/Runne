[package]
name = "runne-inference-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
runne-inference-protocol.workspace = true
runne-engine-broker.workspace = true
rustix.workspace = true
sha2.workspace = true
hex.workspace = true

[features]
default = []
# Deterministic fake backend: conformance/tests only. Never satisfies the
# real-backend qualification gate.
backend-fake = []

[[test]]
name = "fake_session"
required-features = ["backend-fake"]

[[test]]
name = "cancel"
required-features = ["backend-fake"]

[[test]]
name = "artifact_transport"
required-features = ["backend-fake"]

[[test]]
name = "worker_backend"

[dev-dependencies]
runne-local-model.workspace = true
runne-llama-worker = { path = "../runne-llama-worker" }
tempfile.workspace = true

[lints]
workspace = true
