[workspace]
resolver = "3"
members = [
  "crates/gocode-api",
  "crates/gocode-domain",
  "crates/gocode-application",
  "crates/gocode-store",
  "crates/gocode-opencode-compat",
  "crates/gocode-opencode-adapter-sqlite",
  "crates/gocode-plugin-protocol",
  "crates/gocode-observability",
  "crates/gocode-platform",
  "crates/gocode-runtime",
  "crates/gocode-security",
  "crates/gocode-daemon",
  "crates/gocode-http",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
sha2 = "=0.10.8"
uuid = { version = "1", features = ["v7"] }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
