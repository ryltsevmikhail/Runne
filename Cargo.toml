[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "src-tauri/crates/app-core",
  "src-tauri/crates/runtime-client",
  "src-tauri/crates/platform-ports",
  "src-tauri/crates/secure-store",
  "src-tauri/crates/local-store",
  "src-tauri/crates/platform-desktop",
  "src-tauri/crates/platform-mobile",
"src-tauri/crates/pairing-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.12.28", default-features = false }
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
sha2 = "=0.10.9"
ed25519-dalek = "=2.1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
