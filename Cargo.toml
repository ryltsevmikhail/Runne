[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

# Protected bundled-runtime integration tests execute the real daemon and
# stage it once per durable fault point. Keeping test binaries free of debug
# information prevents the fixture from exhausting the worker's runtime tmpfs.
[profile.test]
debug = 0

[workspace.dependencies]
aho-corasick = "=1.1.4"
async-trait = "0.1"
argon2 = { version = "=0.5.3", features = ["zeroize"] }
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "=2.1.1"
hex = "0.4"
reqwest = { version = "=0.12.28", default-features = false }
ring = "=0.17.14"
rusqlite = { version = "=0.34.0", features = ["bundled"] }
rcgen = { version = "=0.14.5", default-features = false, features = ["ring", "zeroize"] }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.8"
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "tray-icon"] }
thiserror = "=2.0.18"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1", features = ["v7"] }
zeroize = "=1.9.0"
runne-release-authority = { path = "crates/runne-release-authority" }
runne-promotion-contracts = { path = "crates/runne-promotion-contracts" }
runne-project-owner-authority = { path = "crates/runne-project-owner-authority" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
