[package]
name = "gocode-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
gocode-domain = { path = "../gocode-domain" }
gocode-application = { path = "../gocode-application" }
gocode-store = { path = "../gocode-store" }
gocode-observability = { path = "../gocode-observability" }
gocode-platform = { path = "../gocode-platform" }
gocode-http = { path = "../gocode-http" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
rand = "0.8"
dirs = "6"
subtle = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = { workspace = true }
fs2 = "0.4"
crc32fast = "1"
rusqlite = "=0.34.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gocode-daemon"
path = "src/main.rs"

[lib]
name = "gocode_daemon"
path = "src/lib.rs"
