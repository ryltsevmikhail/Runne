[package]
name = "gocode-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = []
test-support = ["gocode-platform-desktop?/test-support"]
desktop-protected = ["dep:gocode-platform-desktop", "gocode-platform-desktop/protected-channel-integration", "dep:nix"]

[dependencies]
gocode-api = { path = "../gocode-api" }
gocode-domain = { path = "../gocode-domain" }
gocode-application = { path = "../gocode-application" }
gocode-runtime = { path = "../gocode-runtime" }
gocode-store = { path = "../gocode-store" }
gocode-observability = { path = "../gocode-observability" }
gocode-security = { path = "../gocode-security" }
gocode-secure-store = { path = "../secure-store" }
gocode-provider-openai = { path = "../gocode-provider-openai" }
gocode-provider = { path = "../gocode-provider" }
gocode-platform = { path = "../gocode-platform" }
gocode-platform-desktop = { path = "../platform-desktop", optional = true }
gocode-http = { path = "../gocode-http" }
gocode-daemon-openai-effect = { path = "../gocode-daemon-openai-effect" }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
tower = "0.5"

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = "0.12"
thiserror = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
rand = "0.8"
dirs = "6"
subtle = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = "1"
fs2 = "0.4"
crc32fast = "1"
rusqlite = "=0.34.0"
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "=1.1.4", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket"], optional = true }

[dev-dependencies]
aho-corasick = { workspace = true }
gocode-app-core = { path = "../app-core" }
gocode-platform-desktop = { path = "../platform-desktop", features = ["test-support"] }
gocode-runtime-client = { path = "../runtime-client", features = ["test-support"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "gocode-daemon"
path = "src/main.rs"

[lib]
name = "gocode_daemon"
path = "src/lib.rs"
