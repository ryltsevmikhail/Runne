[package]
name = "gocode-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
gocode-api = { path = "../gocode-api" }
gocode-domain = { path = "../gocode-domain" }
gocode-application = { path = "../gocode-application" }
gocode-runtime = { path = "../gocode-runtime" }
gocode-store = { path = "../gocode-store" }
gocode-observability = { path = "../gocode-observability" }
gocode-platform = { path = "../gocode-platform" }
gocode-http = { path = "../gocode-http" }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
tower = "0.5"

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
rand = "0.8"
dirs = "6"
subtle = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = { workspace = true }
fs2 = "0.4"
crc32fast = "1"
rusqlite = "=0.34.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
gocode-app-core = { path = "../app-core" }
gocode-runtime-client = { path = "../runtime-client" }
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "gocode-daemon"
path = "src/main.rs"

[lib]
name = "gocode_daemon"
path = "src/lib.rs"
