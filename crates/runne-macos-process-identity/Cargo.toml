[package]
name = "runne-macos-process-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-support = ["runne-api/test-support"]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
libc = "0.2"
nix = { version = "=0.31.3", default-features = false, features = ["fs", "poll", "socket"] }
runne-api = { path = "../runne-api" }
runne-provider = { path = "../runne-provider" }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "=2.17.0"
sha2.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
proc-macro2 = "1"
serde.workspace = true
serde_json.workspace = true
syn = { version = "2", features = ["full", "visit"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
