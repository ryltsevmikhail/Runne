[package]
name = "gocode-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
gocode-api = { path = "../gocode-api" }
gocode-application = { path = "../gocode-application" }
gocode-domain = { path = "../gocode-domain" }
hex = "=0.4.3"
sha2 = { workspace = true }
tokio = { version = "=1.44.0", features = ["sync", "rt", "macros", "time"] }
tokio-util = { version = "=0.7.14", features = ["rt"] }

[dev-dependencies]
gocode-opencode-adapter-sqlite = { path = "../gocode-opencode-adapter-sqlite" }
gocode-opencode-compat = { path = "../gocode-opencode-compat" }
gocode-store = { path = "../gocode-store" }
jsonschema = { version = "=0.18.0", default-features = false, features = ["draft202012"] }
serde_json = "=1.0.151"
