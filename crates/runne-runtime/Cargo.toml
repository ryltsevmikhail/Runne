[package]
license.workspace = true
name = "runne-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
provider-terminal-test-support = []

[dependencies]
runne-api = { path = "../runne-api" }
runne-application = { path = "../runne-application" }
runne-domain = { path = "../runne-domain" }
runne-mcp = { path = "../runne-mcp" }
runne-opencode-compat = { path = "../runne-opencode-compat" }
runne-plugin-host = { path = "../runne-plugin-host" }
runne-provider = { path = "../runne-provider" }
runne-secure-store = { path = "../runne-secure-store", default-features = false }
runne-tools = { path = "../runne-tools" }
hex = "=0.4.3"
futures-timer = "=3.0.4"
serde.workspace = true
serde_json = "=1.0.151"
sha2 = { workspace = true }
ring = { workspace = true }
tempfile = "=3.27.0"
thiserror.workspace = true
tracing = "0.1"
tokio = { version = "=1.44.2", features = ["sync", "rt", "macros", "time"] }
tokio-util = { version = "=0.7.14", features = ["rt"] }
zeroize.workspace = true

[dev-dependencies]
futures = "0.3"
tokio = { version = "=1.44.2", features = ["test-util"] }
base64.workspace = true
aho-corasick.workspace = true
runne-api = { path = "../runne-api", features = ["test-support"] }
runne-opencode-adapter-sqlite = { path = "../runne-opencode-adapter-sqlite" }
runne-opencode-compat = { path = "../runne-opencode-compat" }
runne-platform = { path = "../runne-platform" }
runne-provider-openai = { path = "../runne-provider-openai" }
runne-security = { path = "../runne-security" }
runne-store = { path = "../runne-store" }
jsonschema = { version = "=0.18.0", default-features = false, features = ["draft202012"] }
rusqlite = { version = "=0.34.0", features = ["bundled"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
