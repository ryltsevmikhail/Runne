[package]
name = "runne-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dev-dependencies]
runne-domain = { path = "../runne-domain" }
runne-api = { path = "../runne-api" }
tempfile = "3.17.0"

[dependencies]
runne-application = { path = "../runne-application" }
runne-platform-ports = { path = "../runne-platform-ports" }
sha2 = { workspace = true }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
uuid = { version = "1", features = ["v4"] }
