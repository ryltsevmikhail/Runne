[package]
name = "runne-macos-xpc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = []

[dependencies]
runne-platform-ports = { path = "../runne-platform-ports" }
rand.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = { version = "=0.6.4", features = ["exception"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "NSData",
  "NSError",
  "NSObject",
  "NSString",
  "NSXPCConnection",
  "block2",
  "libc",
  "std",
] }
objc2-service-management = { version = "=0.3.2", default-features = false, features = [
  "SMAppService",
  "objc2",
  "objc2-foundation",
  "std",
] }
tokio.workspace = true
libc = "0.2"

[build-dependencies]
cc = "=1.4.0"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
