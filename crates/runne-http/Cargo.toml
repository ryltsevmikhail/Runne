[package]
license.workspace = true
name = "runne-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
default = []
test-support = []

[dependencies]
runne-api = { path = "../runne-api" }
runne-domain = { path = "../runne-domain" }
runne-application = { path = "../runne-application" }
runne-store = { path = "../runne-store" }
runne-observability = { path = "../runne-observability" }
runne-opencode-compat = { path = "../runne-opencode-compat" }

axum = "0.8"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "tokio"] }
rustls.workspace = true
tokio = { workspace = true }
tokio-rustls.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
tower = "0.5"
tower-http = "0.6"
http = "1"
subtle = "2"
bytes = "1"
thiserror = { workspace = true }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"
tracing = "0.1"
base64 = { workspace = true }

[dev-dependencies]
runne-pairing-crypto = { path = "../runne-pairing-crypto" }
chrono.workspace = true
tokio-test = "0.4"
hmac = "0.12"
sha2 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
reqwest = { version = "0.12", features = ["json"] }
jsonschema = { version = "=0.18.0", default-features = false, features = ["draft202012"] }
rusqlite = "=0.34.0"
tempfile = "3"
runne-security = { path = "../runne-security" }
