[package]
name = "runne-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = []

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
runne-domain = { path = "../runne-domain" }
runne-plugin-protocol = { path = "../runne-plugin-protocol" }
hmac = "0.12"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2.workspace = true
subtle = "2"
zeroize.workspace = true
jsonschema = { version = "=0.18.0", default-features = false, features = ["draft202012"] }

[dev-dependencies]
tempfile = "=3.27.0"
