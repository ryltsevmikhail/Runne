[package]
name = "gocode-secure-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = { workspace = true, optional = true }
gocode-api = { path = "../gocode-api" }
gocode-provider = { path = "../gocode-provider" }
rand = "0.8"
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[features]
default = []
project-owner-key-store = ["dep:ed25519-dalek"]
test-support = []

[target.'cfg(target_os = "macos")'.dependencies]
gocode-macos-keychain-acl = { path = "../macos-keychain-acl" }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[dev-dependencies]
hex.workspace = true
serde.workspace = true
tempfile = "=3.27.0"

[[test]]
name = "project_owner_key"
path = "tests/project_owner_key.rs"
required-features = ["project-owner-key-store"]

[lints]
workspace = true
