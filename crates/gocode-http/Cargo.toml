[package]
name = "gocode-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
gocode-domain = { path = "../gocode-domain" }
gocode-application = { path = "../gocode-application" }
gocode-store = { path = "../gocode-store" }
gocode-observability = { path = "../gocode-observability" }
gocode-opencode-compat = { path = "../gocode-opencode-compat" }

axum = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
tower = "0.5"
tower-http = "0.6"
http = "1"
subtle = "2"
bytes = "1"
thiserror = { workspace = true }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
jsonschema = { version = "=0.18.0", default-features = false, features = ["draft202012"] }
