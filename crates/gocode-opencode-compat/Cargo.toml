[package]
name = "gocode-opencode-compat"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
gocode-api = { path = "../gocode-api" }
gocode-domain = { path = "../gocode-domain" }
jsonschema = { version = "=0.18.0", default-features = false, features = ["draft202012"] }
serde_json = "=1.0.151"
sha2 = "=0.10.8"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
serde_jcs = "=0.2.0"
tokio = { version = "=1.44.2", features = ["macros", "rt"] }
