[package]
name = "gocode-opencode-compat"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Zero production dependencies in Phase 2a

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.2.0"
sha2 = "=0.10.8"
jsonschema = { version = "=0.18.0", default-features = false, features = ["draft202012"] }
