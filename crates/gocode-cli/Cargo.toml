[package]
name = "gocode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[dependencies]
base64.workspace = true
chrono.workspace = true
gocode-runtime-client = { path = "../runtime-client" }
gocode-project-owner-authority = { path = "../project-owner-authority" }
gocode-release-authority = { path = "../gocode-release-authority" }
gocode-secure-store = { path = "../secure-store", default-features = false, features = ["project-owner-key-store"] }
hex.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
gocode-daemon = { path = "../gocode-daemon", features = ["test-support"] }
tempfile = "=3.27.0"

[[bin]]
name = "gocode"
path = "src/main.rs"

[[test]]
name = "provider_credential_harness"
path = "tests/provider_credential_harness.rs"
harness = false

[[test]]
name = "release_dry_run_cli"
path = "tests/release_dry_run_cli.rs"

[[test]]
name = "cli_foundation"
path = "tests/cli_foundation.rs"

[lints]
workspace = true
