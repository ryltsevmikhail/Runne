[package]
name = "gocode-daemon-openai-effect"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
bytes = "1"
gocode-provider = { path = "../gocode-provider" }
gocode-provider-openai = { path = "../gocode-provider-openai" }
gocode-secure-store = { path = "../secure-store" }
gocode-store = { path = "../gocode-store" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
thiserror = { workspace = true }
subtle = "2"
tokio = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
gocode-domain = { path = "../gocode-domain" }
