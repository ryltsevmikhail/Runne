[package]
license.workspace = true
name = "runne-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
test-support = []

[dependencies]
runne-application = { path = "../runne-application" }
runne-api = { path = "../runne-api" }
runne-domain = { path = "../runne-domain" }
runne-provider = { path = "../runne-provider" }
runne-provider-quota = { path = "../runne-provider-quota" }
runne-runtime = { path = "../runne-runtime" }
runne-secure-store = { path = "../runne-secure-store", default-features = false }
runne-sqlite-handle-identity = { path = "../runne-sqlite-handle-identity" }
rand = "0.8"
rusqlite = { version = "=0.34.0", features = ["backup", "bundled", "functions"] }
sha2 = "=0.10.8"
hmac = "0.12"
futures-timer = "=3.0.4"
async-trait = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
runne-platform = { path = "../runne-platform" }

[target.'cfg(windows)'.dependencies]
runne-sqlite-native-identity = { path = "../runne-sqlite-native-identity" }
runne-windows-native-handle = { path = "../runne-windows-native-handle" }

[dev-dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
runne-native-qualification = { path = "../runne-native-qualification", features = ["test-support"] }
runne-api = { path = "../runne-api", features = ["test-support"] }
runne-runtime = { path = "../runne-runtime", features = ["provider-terminal-test-support"] }
runne-daemon-responses-effect = { path = "../runne-daemon-responses-effect" }
runne-daemon-chat-completions-effect = { path = "../runne-daemon-chat-completions-effect" }
runne-daemon-native-effect = { path = "../runne-daemon-native-effect" }
runne-daemon-radius-effect = { path = "../runne-daemon-radius-effect" }
runne-provider-chat-completions = { path = "../runne-provider-chat-completions" }
runne-provider-native-wire = { path = "../runne-provider-native-wire" }
runne-provider-quota = { path = "../runne-provider-quota" }
runne-provider-radius = { path = "../runne-provider-radius" }
runne-provider-responses-wire = { path = "../runne-provider-responses-wire" }
runne-security = { path = "../runne-security" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { version = "2", features = ["full"] }
tempfile = "3"
futures = "0.3"
tokio = { workspace = true, features = ["macros", "rt"] }
