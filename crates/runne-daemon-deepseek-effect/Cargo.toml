[package]
name = "runne-daemon-deepseek-effect"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
bytes = "1"
runne-provider = { path = "../runne-provider" }
runne-provider-deepseek = { path = "../runne-provider-deepseek" }
runne-secure-store = { path = "../runne-secure-store", default-features = false }
runne-store = { path = "../runne-store" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
thiserror = { workspace = true }
subtle = "2"
tokio = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
runne-application = { path = "../runne-application" }
runne-domain = { path = "../runne-domain" }
h2 = "0.4"
http = "1"
rcgen = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
tempfile = "3"
tokio-rustls = { workspace = true }
