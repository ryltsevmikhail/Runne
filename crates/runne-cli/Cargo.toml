[package]
name = "runne-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[dependencies]
base64.workspace = true
chrono.workspace = true
dirs = "6"
runne-runtime-client = { path = "../runne-runtime-client" }
runne-provider = { path = "../runne-provider" }
runne-project-owner-authority = { path = "../runne-project-owner-authority" }
runne-release-authority = { path = "../runne-release-authority" }
runne-secure-store = { path = "../runne-secure-store", default-features = false, features = ["project-owner-key-store", "provider-credential-broker-writer"] }
hex.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml = "0.8"
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
runne-native-enrollment-authority = { path = "../runne-native-enrollment-authority" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { version = "=1.1.4", features = ["net"] }

[dev-dependencies]
ed25519-dalek.workspace = true
proc-macro2 = "1"
runne-daemon = { path = "../runne-daemon", features = ["test-support"] }
runne-secure-store = { path = "../runne-secure-store", default-features = false, features = ["test-support"] }
syn = { version = "2", features = ["full", "visit"] }
tempfile = "=3.27.0"

[[bin]]
name = "runne"
path = "src/main.rs"

[[test]]
name = "provider_credential_harness"
path = "tests/provider_credential_harness.rs"
harness = false

[[test]]
name = "release_dry_run_cli"
path = "tests/release_dry_run_cli.rs"

[[test]]
name = "cli_foundation"
path = "tests/cli_foundation.rs"

[lints]
workspace = true
