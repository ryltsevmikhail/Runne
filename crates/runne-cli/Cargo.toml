[package]
name = "runne-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[features]
writer-entry-fixture = []
default = []
local-native-enrollment-test = [
    "nix/signal",
    "runne-api/test-support",
    "runne-native-enrollment-authority/local-native-enrollment-test",
    "runne-secure-store/local-native-enrollment-test",
    "runne-secure-store/test-support",
]
persistent-reference-probe = [
    "local-native-enrollment-test",
    "runne-macos-keychain-acl/persistent-reference-probe",
]
linux-native-enrollment-qualification = [
    "nix/signal",
    "runne-platform-desktop/linux-native-enrollment-qualification",
    "runne-secure-store/linux-native-enrollment-qualification",
]

[dependencies]
crossterm = "=0.29.0"
unicode-width = "=0.2.2"
base64.workspace = true
chrono.workspace = true
dirs = "6"
runne-runtime-client = { path = "../runne-runtime-client" }
runne-api = { path = "../runne-api" }
runne-provider = { path = "../runne-provider" }
runne-project-owner-authority = { path = "../runne-project-owner-authority" }
runne-release-authority = { path = "../runne-release-authority" }
runne-secure-store = { path = "../runne-secure-store", default-features = false, features = ["project-owner-key-store", "provider-credential-broker-writer"] }
hex.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml = "0.8"
zeroize.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs", "poll"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process"] }
runne-macos-keychain-acl = { path = "../runne-macos-keychain-acl" }
runne-macos-xpc = { path = "../runne-macos-xpc" }
runne-platform-desktop = { path = "../runne-platform-desktop", features = ["protected-channel-integration"] }
runne-platform-ports = { path = "../runne-platform-ports" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
runne-native-enrollment-authority = { path = "../runne-native-enrollment-authority" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dev-dependencies]
rustix = { version = "=1.1.4", features = ["net", "pipe", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
runne-platform-desktop = { path = "../runne-platform-desktop", features = ["protected-channel-integration"] }
gtk = "=0.18.2"
nix = { version = "=0.31.3", default-features = false, features = ["fs", "poll", "process"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
runne-application = { path = "../runne-application" }
runne-domain = { path = "../runne-domain" }
runne-security = { path = "../runne-security" }
runne-store = { path = "../runne-store" }
uuid.workspace = true

[[bin]]
name = "writer-entry-fixture"
path = "writer-entry-fixture/main.rs"
required-features = ["writer-entry-fixture"]

[dev-dependencies]
reqwest = { workspace = true, features = ["rustls-tls"] }
runne-runtime-client = { path = "../runne-runtime-client", features = ["test-support"] }
runne-http = { path = "../runne-http", features = ["test-support"] }
runne-platform-ports = { path = "../runne-platform-ports" }
ed25519-dalek.workspace = true
proc-macro2 = "1"
runne-daemon = { path = "../runne-daemon", features = ["test-support", "desktop-protected"] }
runne-provider = { path = "../runne-provider", features = ["test-support"] }
runne-secure-store = { path = "../runne-secure-store", default-features = false, features = ["test-support"] }
syn = { version = "2", features = ["full", "visit"] }
tempfile = "=3.27.0"

[[bin]]
name = "runne"
path = "src/main.rs"

[[test]]
name = "provider_credential_harness"
path = "tests/provider_credential_harness.rs"
harness = false

[[test]]
name = "release_dry_run_cli"
path = "tests/release_dry_run_cli.rs"

[[test]]
name = "cli_foundation"
path = "tests/cli_foundation.rs"

[lints]
workspace = true

[[test]]
name = "writer_entry_fixture_regression"
path = "tests/writer_entry_fixture_regression.rs"
required-features = ["writer-entry-fixture"]
