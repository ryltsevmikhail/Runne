[package]
name = "runne-native-enrollment-authority"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
local-native-enrollment-test = ["runne-macos-process-identity/test-support"]

[dependencies]
runne-provider = { path = "../runne-provider" }

[target.'cfg(target_os = "macos")'.dependencies]
runne-macos-process-identity = { path = "../runne-macos-process-identity" }

[dev-dependencies]
proc-macro2 = "1"
serde.workspace = true
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true
