[package]
name = "gocode-platform-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = ["gocode-api/test-support", "gocode-runtime-client/test-support"]

[dependencies]
gocode-api = { path = "../gocode-api" }
gocode-platform-ports = { path = "../platform-ports" }
gocode-runtime-client = { path = "../runtime-client" }
hex.workspace = true
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize = "=1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "=1.1.4", features = ["fs", "net", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket"] }

[target.'cfg(windows)'.dependencies]
gocode-windows-native-handle = { path = "../windows-native-handle" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
