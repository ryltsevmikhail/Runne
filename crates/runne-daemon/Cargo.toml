[package]
name = "runne-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = []
test-support = ["runne-platform-desktop?/test-support", "runne-native-qualification/test-support", "runne-secure-store/test-support", "runne-provider/test-support", "dep:reqwest"]
desktop-protected = ["dep:runne-platform-desktop", "runne-platform-desktop/protected-channel-integration", "dep:nix"]
persistent-reference-probe = [
    "test-support",
    "desktop-protected",
    "runne-macos-keychain-acl/persistent-reference-probe",
    "dep:runne-native-enrollment-authority",
    "runne-native-enrollment-authority/local-native-enrollment-test",
]

[dependencies]
runne-api = { path = "../runne-api" }
runne-domain = { path = "../runne-domain" }
runne-application = { path = "../runne-application" }
runne-runtime = { path = "../runne-runtime" }
runne-store = { path = "../runne-store" }
runne-observability = { path = "../runne-observability" }
runne-security = { path = "../runne-security" }
runne-secure-store = { path = "../runne-secure-store", default-features = false }
runne-provider-openai = { path = "../runne-provider-openai" }
runne-provider-deepseek = { path = "../runne-provider-deepseek" }
runne-provider = { path = "../runne-provider" }
runne-platform = { path = "../runne-platform" }
runne-platform-ports = { path = "../runne-platform-ports" }
runne-platform-desktop = { path = "../runne-platform-desktop", optional = true }
runne-http = { path = "../runne-http" }
runne-daemon-openai-effect = { path = "../runne-daemon-openai-effect" }
runne-daemon-deepseek-effect = { path = "../runne-daemon-deepseek-effect" }
runne-daemon-local-engine-effect = { path = "../runne-daemon-local-engine-effect" }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
tower = "0.5"

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = "0.12"
thiserror = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
rand = "0.8"
dirs = "6"
subtle = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = "1"
fs2 = "0.4"
crc32fast = "1"
rusqlite = "=0.34.0"
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
runne-windows-native-handle = { path = "../runne-windows-native-handle" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket"], optional = true }
runne-macos-xpc = { path = "../runne-macos-xpc" }
runne-macos-keychain-acl = { path = "../runne-macos-keychain-acl" }
runne-native-qualification = { path = "../runne-native-qualification" }
runne-native-enrollment-authority = { path = "../runne-native-enrollment-authority", optional = true }

[dev-dependencies]
futures = "0.3"
core-foundation = "=0.10.1"
ed25519-dalek.workspace = true
runne-provider = { path = "../runne-provider", features = ["test-support"] }
runne-pairing-crypto = { path = "../runne-pairing-crypto" }
aho-corasick = { workspace = true }
runne-app-core = { path = "../runne-app-core", features = ["test-support"] }
runne-macos-keychain-acl = { path = "../runne-macos-keychain-acl" }
runne-platform-desktop = { path = "../runne-platform-desktop", features = ["test-support"] }
runne-runtime-client = { path = "../runne-runtime-client", features = ["test-support"] }
runne-secure-store = { path = "../runne-secure-store", default-features = false, features = ["test-support"] }
runne-sqlite-handle-identity = { path = "../runne-sqlite-handle-identity" }
tempfile = "3"
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }

[[bin]]
name = "runned"
path = "src/main.rs"

[[test]]
name = "protected_bundled_runtime_process"
path = "tests/protected_bundled_runtime_process.rs"
required-features = ["test-support", "desktop-protected"]

[[test]]
name = "provider_credential_writer_authority"
path = "tests/provider_credential_writer_authority.rs"
required-features = ["test-support", "desktop-protected"]

[lib]
name = "runne_daemon"
path = "src/lib.rs"
