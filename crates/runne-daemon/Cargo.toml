[package]
name = "runne-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = []
test-support = ["runne-platform-desktop?/test-support", "dep:reqwest"]
desktop-protected = ["dep:runne-platform-desktop", "runne-platform-desktop/protected-channel-integration", "dep:nix"]

[dependencies]
runne-api = { path = "../runne-api" }
runne-domain = { path = "../runne-domain" }
runne-application = { path = "../runne-application" }
runne-runtime = { path = "../runne-runtime" }
runne-store = { path = "../runne-store" }
runne-observability = { path = "../runne-observability" }
runne-security = { path = "../runne-security" }
runne-secure-store = { path = "../runne-secure-store", default-features = false }
runne-provider-openai = { path = "../runne-provider-openai" }
runne-provider-deepseek = { path = "../runne-provider-deepseek" }
runne-provider = { path = "../runne-provider" }
runne-platform = { path = "../runne-platform" }
runne-platform-desktop = { path = "../runne-platform-desktop", optional = true }
runne-http = { path = "../runne-http" }
runne-daemon-openai-effect = { path = "../runne-daemon-openai-effect" }
runne-daemon-deepseek-effect = { path = "../runne-daemon-deepseek-effect" }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
tower = "0.5"

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = "0.12"
thiserror = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
rand = "0.8"
dirs = "6"
subtle = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = "1"
fs2 = "0.4"
crc32fast = "1"
rusqlite = "=0.34.0"
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "=1.1.4", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket"], optional = true }

[dev-dependencies]
runne-pairing-crypto = { path = "../runne-pairing-crypto" }
aho-corasick = { workspace = true }
runne-app-core = { path = "../runne-app-core", features = ["test-support"] }
runne-platform-desktop = { path = "../runne-platform-desktop", features = ["test-support"] }
runne-runtime-client = { path = "../runne-runtime-client", features = ["test-support"] }
tempfile = "3"
reqwest = { workspace = true, features = ["json", "rustls-tls"] }

[[bin]]
name = "runned"
path = "src/main.rs"

[[test]]
name = "protected_bundled_runtime_process"
path = "tests/protected_bundled_runtime_process.rs"
required-features = ["test-support", "desktop-protected"]

[lib]
name = "runne_daemon"
path = "src/lib.rs"
