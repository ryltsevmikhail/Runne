[package]
name = "runne-platform-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
dev-loopback-updater = []
protected-channel-integration = []
test-support = ["runne-api/test-support", "runne-runtime-client/test-support"]

[dependencies]
ed25519-dalek.workspace = true
runne-api = { path = "../runne-api" }
runne-platform-ports = { path = "../runne-platform-ports" }
runne-provider = { path = "../runne-provider" }
runne-runtime-client = { path = "../runne-runtime-client" }
hex.workspace = true
rand = "0.8"
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize = "=1.9.0"
ring.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "=1.1.4", features = ["fs", "net", "pipe", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["dir", "fs", "process", "signal", "socket", "term", "user"] }
runne-macos-process-identity = { path = "../runne-macos-process-identity" }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
runne-macos-process-identity = { path = "../runne-macos-process-identity", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
runne-windows-native-handle = { path = "../runne-windows-native-handle" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
runne-api = { path = "../runne-api", features = ["test-support"] }
