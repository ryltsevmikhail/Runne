[package]
name = "gocode-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
gocode-domain = { path = "../gocode-domain" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
jsonschema = { version = "=0.18.0", default-features = false, features = ["draft202012"] }
