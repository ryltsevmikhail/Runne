[package]
name = "runne-secure-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = { workspace = true, optional = true }
runne-api = { path = "../runne-api" }
runne-provider = { path = "../runne-provider" }
rand = "0.8"
ring.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[features]
default = []
project-owner-key-store = ["dep:ed25519-dalek"]
provider-credential-broker-writer = []
test-support = []

[target.'cfg(target_os = "macos")'.dependencies]
runne-macos-keychain-acl = { path = "../runne-macos-keychain-acl" }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
hex.workspace = true
runne-provider = { path = "../runne-provider", features = ["test-support"] }
serde.workspace = true
tempfile = "=3.27.0"

[[test]]
name = "project_owner_key"
path = "tests/project_owner_key.rs"
required-features = ["project-owner-key-store"]

[lints]
workspace = true
