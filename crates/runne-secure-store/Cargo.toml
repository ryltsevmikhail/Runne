[package]
name = "runne-secure-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = { workspace = true, optional = true }
runne-api = { path = "../runne-api" }
runne-provider = { path = "../runne-provider" }
runne-provider-oauth = { path = "../runne-provider-oauth" }
rand = "0.8"
ring.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[features]
default = []
project-owner-key-store = ["dep:ed25519-dalek"]
provider-credential-broker-writer = ["dep:runne-native-enrollment-authority"]
test-support = ["runne-api/test-support"]
local-native-enrollment-test = [
    "test-support",
    "runne-macos-keychain-acl/local-native-enrollment-test",
    "runne-macos-xpc/test-support",
]
linux-native-enrollment-qualification = []

[target.'cfg(target_os = "macos")'.dependencies]
runne-macos-keychain-acl = { path = "../runne-macos-keychain-acl" }
runne-macos-xpc = { path = "../runne-macos-xpc" }
runne-native-enrollment-authority = { path = "../runne-native-enrollment-authority", optional = true }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
runne-native-enrollment-authority = { path = "../runne-native-enrollment-authority", optional = true }
aes = { version = "=0.9.3", features = ["zeroize"] }
block-padding = "=0.4.2"
cbc = { version = "=0.2.1", features = ["block-padding", "alloc", "zeroize"] }
dbus = "=0.9.12"
hkdf = "=0.12.4"
keyring = { version = "=3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
linux-keyutils = "=0.2.5"
num = "=0.4.3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
hex.workspace = true
runne-provider = { path = "../runne-provider", features = ["test-support"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "=3.27.0"

[[test]]
name = "project_owner_key"
path = "tests/project_owner_key.rs"
required-features = ["project-owner-key-store"]

[lints]
workspace = true
